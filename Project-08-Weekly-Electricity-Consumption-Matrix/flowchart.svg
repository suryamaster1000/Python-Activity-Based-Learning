<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1040" viewBox="0 0 820 1040"><rect width="820" height="1040" rx="20" fill="#f5f7fb"/><g font-family="Arial" text-anchor="middle" fill="#1e293b"><text x="410" y="42" font-size="26" font-weight="bold">Weekly Electricity Consumption Matrix</text><rect x="335" y="65" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="94" font-size="18" fill="white">START</text><path d="M410 110V140 M410 205V235 M410 315V345 M410 425V455 M410 535V565 M410 645V675 M410 755V785 M410 865V895" stroke="#64748b" stroke-width="2" fill="none"/><rect x="245" y="140" width="330" height="65" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="167" font-size="17">Input number of weeks</text><text x="410" y="188" font-size="14">Must be at least one</text><rect x="220" y="235" width="380" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="265" font-size="17">Read 7 daily readings per week</text><text x="410" y="288" font-size="14">Reject negative values</text><text x="410" y="305" font-size="14">Store as matrix rows</text><rect x="220" y="345" width="380" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="375" font-size="17">Calculate weekly totals</text><text x="410" y="398" font-size="14">Calculate daily averages</text><rect x="220" y="455" width="380" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="485" font-size="17">Compare adjacent weeks</text><text x="410" y="508" font-size="14">Show change and percentage if possible</text><rect x="220" y="565" width="380" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="595" font-size="17">Scan all daily readings</text><text x="410" y="618" font-size="14">Find highest/lowest and count high-use days</text><path d="M410 675L545 715L410 755L275 715Z" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="410" y="720" font-size="16">Reading above 15 kWh?</text><rect x="50" y="785" width="300" height="80" rx="10" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="200" y="815" font-size="17">Yes: record high-use alert</text><text x="200" y="838" font-size="14">Increase alert count</text><rect x="470" y="785" width="300" height="80" rx="10" fill="#e4f4ea" stroke="#39845a" stroke-width="2"/><text x="620" y="815" font-size="17">No: continue scan</text><text x="620" y="838" font-size="14">No alert added</text><path d="M275 715H200V785 M545 715H620V785 M200 865V895H410 M620 865V895H410" stroke="#64748b" stroke-width="2" fill="none"/><rect x="220" y="895" width="380" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="925" font-size="17">Display weekly and overall summary</text><text x="410" y="946" font-size="14">Totals, averages, changes and extremes</text><rect x="335" y="985" width="150" height="35" rx="18" fill="#10243a"/><text x="410" y="1008" font-size="16" fill="white">END</text></g></svg>