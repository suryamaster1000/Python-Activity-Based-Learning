<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1060" viewBox="0 0 820 1060"><rect width="820" height="1060" rx="20" fill="#f5f7fb"/><g font-family="Arial" text-anchor="middle" fill="#1e293b"><text x="410" y="42" font-size="26" font-weight="bold">Student Marks Matrix Analysis</text><rect x="335" y="65" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="94" font-size="18" fill="white">START</text><path d="M410 110V140 M410 205V235 M410 300V330 M410 395V425 M410 505V535 M410 615V645 M410 725V755 M410 835V865 M410 925V955" stroke="#64748b" stroke-width="2" fill="none"/><rect x="245" y="140" width="330" height="65" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="167" font-size="17">Input student and subject counts</text><text x="410" y="188" font-size="14">Each count must be at least one</text><rect x="245" y="235" width="330" height="65" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="262" font-size="17">Input subject names</text><text x="410" y="283" font-size="14">Then read each student's name</text><rect x="230" y="330" width="360" height="65" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="357" font-size="17">Input marks for each subject</text><text x="410" y="378" font-size="14">Validate every mark from 0 to 100</text><rect x="220" y="425" width="380" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="455" font-size="17">Store marks in a matrix</text><text x="410" y="478" font-size="14">Rows = students; columns = subjects</text><path d="M410 535L545 575L410 615L275 575Z" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="410" y="580" font-size="16">For every student row</text><rect x="220" y="645" width="380" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="675" font-size="17">Calculate total and average</text><text x="410" y="698" font-size="14">Check if every subject meets pass mark</text><rect x="220" y="755" width="380" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="785" font-size="17">Summarize each subject column</text><text x="410" y="808" font-size="14">Find subject totals and averages</text><rect x="220" y="865" width="380" height="60" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="890" font-size="17">Find highest and lowest marks</text><text x="410" y="911" font-size="14">Remember student and subject labels</text><rect x="220" y="955" width="380" height="55" rx="10" fill="#e4f4ea" stroke="#39845a" stroke-width="2"/><text x="410" y="988" font-size="17">Display complete analysis and END</text><text x="410" y="1037" font-size="13" fill="#64748b">Example pass mark: 40 in every subject</text></g></svg>