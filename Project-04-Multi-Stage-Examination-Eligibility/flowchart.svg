<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1050" viewBox="0 0 800 1050"><rect width="800" height="1050" rx="20" fill="#f5f7fb"/><g font-family="Arial" text-anchor="middle" fill="#1e293b"><text x="400" y="42" font-size="26" font-weight="bold">Examination Eligibility Flowchart</text><rect x="320" y="65" width="160" height="45" rx="22" fill="#10243a"/><text x="400" y="94" font-size="18" fill="white">START</text><path d="M400 110V140 M400 200V230 M400 300V330 M400 410V440 M400 510V550 M400 620V660 M400 730V770 M400 840V880" stroke="#64748b" stroke-width="2" fill="none"/><rect x="230" y="140" width="340" height="60" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="400" y="165" font-size="17">Input student count</text><text x="400" y="185" font-size="14">Must be greater than zero</text><rect x="190" y="230" width="420" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="400" y="258" font-size="17">Input student details</text><text x="400" y="280" font-size="14">Name, attendance, labs, marks, fees</text><rect x="190" y="330" width="420" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="400" y="360" font-size="17">Check four requirements</text><text x="400" y="383" font-size="14">Attendance ≥75%, labs ≥1, marks ≥40, fees yes</text><path d="M400 440L530 475L400 510L270 475Z" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="400" y="480" font-size="16">All conditions met?</text><path d="M270 475H100V550H200 M530 475H700V550H600" stroke="#64748b" stroke-width="2" fill="none"/><text x="180" y="463" font-size="14">No</text><text x="620" y="463" font-size="14">Yes</text><rect x="30" y="550" width="250" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="155" y="578" font-size="16">NOT ELIGIBLE</text><text x="155" y="600" font-size="13">List unmet requirements</text><rect x="520" y="550" width="250" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="645" y="578" font-size="16">ELIGIBLE</text><text x="645" y="600" font-size="13">All rules satisfied</text><path d="M155 620V645H400 M645 620V645H400V660" stroke="#64748b" stroke-width="2" fill="none"/><rect x="210" y="660" width="380" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="400" y="688" font-size="16">Store and display student result</text><text x="400" y="710" font-size="13">Repeat for each student</text><path d="M400 770L520 805L400 840L280 805Z" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="400" y="810" font-size="16">More students?</text><rect x="260" y="880" width="280" height="55" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="400" y="903" font-size="16">Display eligibility totals</text><text x="400" y="923" font-size="13">Eligible / not eligible</text><path d="M400 935V960" stroke="#64748b" stroke-width="2"/><rect x="320" y="960" width="160" height="45" rx="22" fill="#10243a"/><text x="400" y="988" font-size="18" fill="white">STOP</text><text x="400" y="1030" font-size="12">Illustrative thresholds only</text></g></svg>