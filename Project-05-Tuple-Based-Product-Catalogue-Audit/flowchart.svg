<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1050" viewBox="0 0 820 1050"><rect width="820" height="1050" rx="20" fill="#f5f7fb"/><g font-family="Arial" text-anchor="middle" fill="#1e293b"><text x="410" y="42" font-size="26" font-weight="bold">Tuple-Based Product Catalogue Audit</text><rect x="335" y="65" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="94" font-size="18" fill="white">START</text><path d="M410 110V135 M410 195V220 M410 285V310 M410 375V400 M410 480V505 M410 575V600 M410 680V705 M410 780V805 M410 875V900" stroke="#64748b" stroke-width="2" fill="none"/><rect x="245" y="135" width="330" height="60" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="160" font-size="17">Input product count</text><text x="410" y="180" font-size="14">Must be at least one</text><rect x="225" y="220" width="370" height="65" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="246" font-size="17">Read product fields</text><text x="410" y="267" font-size="14">ID, name, category, price, stock</text><rect x="220" y="310" width="380" height="65" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="336" font-size="17">Store fields as a tuple</text><text x="410" y="357" font-size="14">Add tuple to catalogue list</text><rect x="210" y="400" width="400" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="429" font-size="17">Audit each tuple</text><text x="410" y="451" font-size="14">Duplicate ID, missing detail, invalid price</text><text x="410" y="468" font-size="14">and stock condition</text><path d="M410 505L545 540L410 575L275 540Z" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="410" y="545" font-size="16">Any audit issue?</text><path d="M275 540H105V620H200 M545 540H715V620H620" stroke="#64748b" stroke-width="2" fill="none"/><text x="185" y="530" font-size="14">Yes</text><text x="635" y="530" font-size="14">No</text><rect x="40" y="620" width="270" height="60" rx="10" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="175" y="645" font-size="16">List warning(s)</text><text x="175" y="665" font-size="14">Update issue counters</text><rect x="510" y="620" width="270" height="60" rx="10" fill="#e4f4ea" stroke="#39845a" stroke-width="2"/><text x="645" y="655" font-size="16">Mark record OK</text><path d="M175 680V705H410 M645 680V705H410V730" stroke="#64748b" stroke-width="2" fill="none"/><rect x="250" y="730" width="320" height="50" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="761" font-size="17">Continue through catalogue</text><rect x="250" y="805" width="320" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="833" font-size="17">Display audit summary</text><text x="410" y="855" font-size="14">Totals for all issue types</text><rect x="335" y="900" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="929" font-size="18" fill="white">END</text><text x="410" y="995" font-size="14" fill="#64748b">Example stock threshold: 1–5 units = low stock</text></g></svg>