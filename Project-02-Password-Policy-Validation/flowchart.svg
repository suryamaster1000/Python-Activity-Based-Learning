 <svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1420" viewBox="0 0 1000 1420" role="img" aria-labelledby="title desc">
<title id="title">Password Policy Validation Engine flowchart</title><desc id="desc">Flowchart for reading sample passwords, checking policy rules, reporting each failure, and displaying the final result.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.bg{fill:#f4f7fb}.node{fill:#fff;stroke:#245780;stroke-width:2}.decision{fill:#fff4d6;stroke:#c58b1b;stroke-width:2}.terminal{fill:#10243a;stroke:#10243a;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.label{font:600 20px Arial,sans-serif;fill:#1e293b;text-anchor:middle}.small{font:16px Arial,sans-serif;fill:#475569;text-anchor:middle}.white{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle}.title{font:700 32px Arial,sans-serif;fill:#10243a;text-anchor:middle}.sub{font:16px Arial,sans-serif;fill:#64748b;text-anchor:middle}</style></defs>
<rect class="bg" width="1000" height="1420" rx="24"/><text class="title" x="500" y="55">Password Policy Validation Engine</text><text class="sub" x="500" y="84">Program flow • beginner Python syllabus</text>
<rect class="terminal" x="380" y="110" width="240" height="58" rx="29"/><text class="white" x="500" y="146">START</text>
<path class="line" d="M500 168 V205"/><rect class="node" x="300" y="205" width="400" height="76" rx="12"/><text class="label" x="500" y="236">Set policy rules</text><text class="small" x="500" y="260">Length, character groups, prohibited text</text>
<path class="line" d="M500 281 V318"/><path class="decision" d="M500 318 L650 370 L500 422 L350 370 Z"/><text class="label" x="500" y="365">Password count</text><text class="small" x="500" y="387">greater than zero?</text>
<path class="line" d="M350 370 H200 V450"/><text class="small" x="260" y="355">No</text><rect class="node" x="70" y="450" width="260" height="65" rx="10"/><text class="label" x="200" y="478">Ask for count again</text><text class="small" x="200" y="499">until it is positive</text><path class="line" d="M200 450 V370 H350"/>
<path class="line" d="M650 370 H790 V450"/><text class="small" x="720" y="355">Yes</text><rect class="node" x="650" y="450" width="280" height="70" rx="10"/><text class="label" x="790" y="479">Input a password</text><text class="small" x="790" y="501">and make lowercase copy</text>
<path class="line" d="M790 520 V555 H500 V590"/><rect class="node" x="270" y="590" width="460" height="82" rx="12"/><text class="label" x="500" y="621">Scan characters</text><text class="small" x="500" y="646">Find uppercase, lowercase, digit, special, spaces</text>
<path class="line" d="M500 672 V710"/><rect class="node" x="270" y="710" width="460" height="82" rx="12"/><text class="label" x="500" y="741">Check other rules</text><text class="small" x="500" y="766">3 repeated characters and prohibited substrings</text>
<path class="line" d="M500 792 V830"/><rect class="node" x="270" y="830" width="460" height="82" rx="12"/><text class="label" x="500" y="861">Evaluate every condition</text><text class="small" x="500" y="886">Print PASS or explain each failed rule</text>
<path class="line" d="M500 912 V950"/><path class="decision" d="M500 950 L650 1002 L500 1054 L350 1002 Z"/><text class="label" x="500" y="1008">All rules pass?</text>
<path class="line" d="M350 1002 H200 V1090"/><text class="small" x="260" y="986">No</text><rect class="node" x="70" y="1090" width="260" height="64" rx="10"/><text class="label" x="200" y="1128">Display REJECT</text>
<path class="line" d="M650 1002 H800 V1090"/><text class="small" x="720" y="986">Yes</text><rect class="node" x="670" y="1090" width="260" height="64" rx="10"/><text class="label" x="800" y="1128">Display ACCEPT</text>
<path class="line" d="M200 1154 V1190 H500 V1220"/><path class="line" d="M800 1154 V1190 H500"/><path class="decision" d="M500 1220 L650 1272 L500 1324 L350 1272 Z"/><text class="label" x="500" y="1267">More passwords?</text><text class="small" x="500" y="1289">to check</text>
<path class="line" d="M350 1272 H60 V485 H650"/><text class="small" x="95" y="1255">Yes</text><path class="line" d="M500 1324 V1350"/><rect class="terminal" x="390" y="1350" width="220" height="52" rx="26"/><text class="white" x="500" y="1383">STOP</text><text class="small" x="660" y="1340">No</text>
</svg>