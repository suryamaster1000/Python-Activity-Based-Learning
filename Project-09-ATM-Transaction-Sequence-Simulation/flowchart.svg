<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1040" viewBox="0 0 820 1040"><rect width="820" height="1040" rx="20" fill="#f5f7fb"/><g font-family="Arial" text-anchor="middle" fill="#1e293b"><text x="410" y="42" font-size="26" font-weight="bold">ATM Transaction Sequence Simulation</text><rect x="335" y="65" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="94" font-size="18" fill="white">START</text><path d="M410 110V140 M410 210V240 M410 310V340 M410 410V440 M410 510V540 M410 610V640 M410 710V740 M410 820V850 M410 920V950" stroke="#64748b" stroke-width="2" fill="none"/><rect x="235" y="140" width="350" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="168" font-size="17">Enter fictional starting balance</text><text x="410" y="191" font-size="14">Reject a negative value</text><rect x="235" y="240" width="350" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="268" font-size="17">Show ATM menu</text><text x="410" y="291" font-size="14">Deposit, withdraw, enquiry, exit</text><path d="M410 340L545 375L410 410L275 375Z" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="410" y="380" font-size="16">Validate menu choice</text><rect x="70" y="440" width="300" height="70" rx="10" fill="#e4f4ea" stroke="#39845a" stroke-width="2"/><text x="220" y="468" font-size="17">Deposit: amount above zero?</text><text x="220" y="490" font-size="14">Add to balance and record</text><rect x="450" y="440" width="300" height="70" rx="10" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="600" y="468" font-size="17">Withdraw: enough funds?</text><text x="600" y="490" font-size="14">Check amount and balance</text><path d="M275 375H220V440 M545 375H600V440 M410 410V540" stroke="#64748b" stroke-width="2" fill="none"/><rect x="250" y="540" width="320" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="568" font-size="17">Enquiry records current balance</text><text x="410" y="591" font-size="14">Invalid choice leaves balance unchanged</text><rect x="250" y="640" width="320" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="668" font-size="17">Repeat menu until Exit selected</text><text x="410" y="691" font-size="14">Keep a transaction history list</text><rect x="250" y="740" width="320" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="770" font-size="17">Display transaction history</text><text x="410" y="794" font-size="14">Show counters and final balance</text><rect x="335" y="850" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="879" font-size="18" fill="white">END</text><text x="410" y="960" font-size="14" fill="#64748b">Simulation only — no bank or real funds involved</text></g></svg>