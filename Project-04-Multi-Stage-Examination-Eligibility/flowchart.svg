<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1500" viewBox="0 0 940 1500" role="img" aria-labelledby="title desc">
<title id="title">Multi-Stage Examination Eligibility System flowchart</title>
<desc id="desc">Input and validate student details, check attendance, laboratory completion, internal marks and fee clearance, collect unmet reasons, display each decision and summarize all students.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.bg{fill:#f4f7fb}.node{fill:#fff;stroke:#245780;stroke-width:2}.decision{fill:#fff4d6;stroke:#c58b1b;stroke-width:2}.terminal{fill:#10243a;stroke:#10243a;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.label{font:600 20px Arial,sans-serif;fill:#1e293b;text-anchor:middle}.small{font:16px Arial,sans-serif;fill:#475569;text-anchor:middle}.white{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle}.title{font:700 30px Arial,sans-serif;fill:#10243a;text-anchor:middle}.sub{font:16px Arial,sans-serif;fill:#64748b;text-anchor:middle}</style></defs>
<rect class="bg" width="940" height="1500" rx="24"/>
<text class="title" x="470" y="48">Multi-Stage Examination Eligibility</text><text class="sub" x="470" y="76">High-level program flow • Python ABL</text>
<rect class="terminal" x="370" y="100" width="200" height="54" rx="27"/><text class="white" x="470" y="134">START</text>
<path class="line" d="M470 154 V185"/><rect class="node" x="245" y="185" width="450" height="70" rx="12"/><text class="label" x="470" y="214">Set eligibility rules</text><text class="small" x="470" y="237">Attendance 75%; internal marks 20/50</text>
<path class="line" d="M470 255 V285"/><rect class="node" x="275" y="285" width="390" height="62" rx="12"/><text class="label" x="470" y="312">Input positive student count</text><text class="small" x="470" y="333">Repeat if count is not positive</text>
<path class="line" d="M470 347 V380"/><rect class="node" x="245" y="380" width="450" height="70" rx="12"/><text class="label" x="470" y="409">Input student information</text><text class="small" x="470" y="432">Name, attendance, labs, marks and fees</text>
<path class="line" d="M470 450 V483"/><rect class="node" x="245" y="483" width="450" height="70" rx="12"/><text class="label" x="470" y="512">Validate each value</text><text class="small" x="470" y="535">Repeat invalid entries until they are valid</text>
<path class="line" d="M470 553 V586"/><rect class="node" x="245" y="586" width="450" height="72" rx="12"/><text class="label" x="470" y="615">Check each eligibility condition</text><text class="small" x="470" y="638">Attendance, labs, internal marks, fee status</text>
<path class="line" d="M470 658 V690"/><rect class="node" x="245" y="690" width="450" height="72" rx="12"/><text class="label" x="470" y="719">Collect every unmet requirement</text><text class="small" x="470" y="742">One student may have multiple reasons</text>
<path class="line" d="M470 762 V795"/><path class="decision" d="M470 795 L615 845 L470 895 L325 845 Z"/><text class="label" x="470" y="841">Any requirement unmet?</text>
<path class="line" d="M325 845 H155 V930"/><text class="small" x="245" y="829">Yes</text><rect class="node" x="35" y="930" width="240" height="70" rx="10"/><text class="label" x="155" y="959">NOT ELIGIBLE</text><text class="small" x="155" y="982">Display all reasons</text>
<path class="line" d="M615 845 H785 V930"/><text class="small" x="700" y="829">No</text><rect class="node" x="665" y="930" width="240" height="70" rx="10"/><text class="label" x="785" y="959">ELIGIBLE</text><text class="small" x="785" y="982">All four conditions pass</text>
<path class="line" d="M155 1000 V1035 H470 V1060"/><path class="line" d="M785 1000 V1035 H470"/>
<rect class="node" x="245" y="1060" width="450" height="66" rx="12"/><text class="label" x="470" y="1087">Store and display student result</text><text class="small" x="470" y="1110">Update eligible / not-eligible counts</text>
<path class="line" d="M470 1126 V1158"/><path class="decision" d="M470 1158 L615 1208 L470 1258 L325 1208 Z"/><text class="label" x="470" y="1204">More students?</text>
<path class="line" d="M325 1208 H45 V415 H245"/><text class="small" x="83" y="1191">Yes</text>
<path class="line" d="M615 1208 H785 V1290"/><text class="small" x="700" y="1191">No</text>
<rect class="node" x="665" y="1290" width="240" height="70" rx="10"/><text class="label" x="785" y="1319">Display final summary</text><text class="small" x="785" y="1342">Eligible and not eligible totals</text>
<path class="line" d="M785 1360 V1390"/><rect class="terminal" x="695" y="1390" width="180" height="50" rx="25"/><text class="white" x="785" y="1422">STOP</text>
<text class="small" x="470" y="1470">Thresholds shown are classroom assumptions, not official policy.</text>
</svg>