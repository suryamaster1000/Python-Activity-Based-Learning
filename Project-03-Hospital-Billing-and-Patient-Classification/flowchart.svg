<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1680" viewBox="0 0 1000 1680" role="img" aria-labelledby="title desc">
<title id="title">Hospital Billing and Patient Classification flowchart</title>
<desc id="desc">The program reads patient information, validates age and charges, computes a gross bill and concession, classifies the final amount, stores records, and shows a summary.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.bg{fill:#f4f7fb}.node{fill:#fff;stroke:#245780;stroke-width:2}.decision{fill:#fff4d6;stroke:#c58b1b;stroke-width:2}.terminal{fill:#10243a;stroke:#10243a;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.label{font:600 20px Arial,sans-serif;fill:#1e293b;text-anchor:middle}.small{font:16px Arial,sans-serif;fill:#475569;text-anchor:middle}.white{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle}.title{font:700 32px Arial,sans-serif;fill:#10243a;text-anchor:middle}.sub{font:16px Arial,sans-serif;fill:#64748b;text-anchor:middle}</style></defs>
<rect class="bg" width="1000" height="1680" rx="24"/>
<text class="title" x="500" y="52">Hospital Billing and Patient Classification</text><text class="sub" x="500" y="82">Program flow • beginner Python syllabus</text>
<rect class="terminal" x="390" y="110" width="220" height="58" rx="29"/><text class="white" x="500" y="146">START</text>
<path class="line" d="M500 168 V205"/><rect class="node" x="300" y="205" width="400" height="70" rx="12"/><text class="label" x="500" y="234">Set policy limits</text><text class="small" x="500" y="257">Age 60+, 10% concession, bill bands</text>
<path class="line" d="M500 275 V310"/><path class="decision" d="M500 310 L660 365 L500 420 L340 365 Z"/><text class="label" x="500" y="360">Patient count</text><text class="small" x="500" y="383">greater than zero?</text>
<path class="line" d="M340 365 H150 V450"/><text class="small" x="250" y="349">No</text><rect class="node" x="45" y="450" width="260" height="62" rx="10"/><text class="label" x="175" y="477">Ask for count again</text><text class="small" x="175" y="499">must be positive</text><path class="line" d="M175 450 V365 H340"/>
<path class="line" d="M660 365 H820 V450"/><text class="small" x="730" y="349">Yes</text><rect class="node" x="675" y="450" width="290" height="70" rx="10"/><text class="label" x="820" y="480">Input patient name</text><text class="small" x="820" y="502">and age</text>
<path class="line" d="M820 520 V560 H500 V590"/><path class="decision" d="M500 590 L650 640 L500 690 L350 640 Z"/><text class="label" x="500" y="635">Name blank or</text><text class="small" x="500" y="657">age is negative?</text>
<path class="line" d="M350 640 H155 V735"/><text class="small" x="245" y="624">Yes</text><rect class="node" x="35" y="735" width="240" height="64" rx="10"/><text class="label" x="155" y="762">Re-enter invalid</text><text class="small" x="155" y="784">name or age</text><path class="line" d="M155 735 V640 H350"/>
<path class="line" d="M650 640 H820 V735"/><text class="small" x="735" y="624">No</text><rect class="node" x="680" y="735" width="285" height="74" rx="10"/><text class="label" x="822" y="765">Input three fees</text><text class="small" x="822" y="789">consultation, diagnostic, treatment</text>
<path class="line" d="M822 809 V845 H500 V875"/><path class="decision" d="M500 875 L650 925 L500 975 L350 925 Z"/><text class="label" x="500" y="920">Any fee negative?</text>
<path class="line" d="M350 925 H155 V1020"/><text class="small" x="245" y="909">Yes</text><rect class="node" x="35" y="1020" width="240" height="64" rx="10"/><text class="label" x="155" y="1047">Re-enter invalid</text><text class="small" x="155" y="1069">fee</text><path class="line" d="M155 1020 V925 H350"/>
<path class="line" d="M650 925 H820 V1020"/><text class="small" x="735" y="909">No</text><rect class="node" x="680" y="1020" width="285" height="70" rx="10"/><text class="label" x="822" y="1050">Calculate gross bill</text><text class="small" x="822" y="1073">add all three fees</text>
<path class="line" d="M822 1090 V1125 H500 V1155"/><path class="decision" d="M500 1155 L650 1205 L500 1255 L350 1205 Z"/><text class="label" x="500" y="1200">Age at least 60?</text>
<path class="line" d="M350 1205 H200 V1290"/><text class="small" x="270" y="1189">No</text><rect class="node" x="55" y="1290" width="290" height="60" rx="10"/><text class="label" x="200" y="1326">Concession = Rs. 0</text>
<path class="line" d="M650 1205 H800 V1290"/><text class="small" x="730" y="1189">Yes</text><rect class="node" x="655" y="1290" width="290" height="60" rx="10"/><text class="label" x="800" y="1326">Concession = gross × 10%</text>
<path class="line" d="M200 1350 V1380 H500 V1400"/><path class="line" d="M800 1350 V1380 H500"/><rect class="node" x="300" y="1400" width="400" height="72" rx="12"/><text class="label" x="500" y="1430">Calculate final bill</text><text class="small" x="500" y="1454">gross bill minus concession</text>
<path class="line" d="M500 1472 V1500"/><rect class="node" x="275" y="1500" width="450" height="62" rx="12"/><text class="label" x="500" y="1527">Classify LOW / MODERATE / HIGH</text><text class="small" x="500" y="1549">store record and update totals</text>
<path class="line" d="M500 1562 V1590"/><rect class="node" x="275" y="1590" width="450" height="50" rx="12"/><text class="label" x="500" y="1621">Print final billing summary</text>
<path class="line" d="M500 1640 V1654"/><rect class="terminal" x="410" y="1654" width="180" height="22" rx="11"/><text class="white" x="500" y="1671" style="font-size:14px">STOP</text>
</svg>
