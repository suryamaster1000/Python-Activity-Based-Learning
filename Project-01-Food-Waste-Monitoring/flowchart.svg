<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">Food Waste Monitoring System flowchart</title>
<desc id="desc">Seven-day meal input, validation, leftover and wastage calculation, daily warning, weekly summary, and stop.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.bg{fill:#f5f7fb}.node{fill:#fff;stroke:#245780;stroke-width:2}.decision{fill:#fff4d6;stroke:#c58b1b;stroke-width:2}.terminal{fill:#10243a;stroke:#10243a;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.label{font:600 19px Arial,sans-serif;fill:#1e293b;text-anchor:middle}.small{font:15px Arial,sans-serif;fill:#475569;text-anchor:middle}.white{font:700 19px Arial,sans-serif;fill:#fff;text-anchor:middle}.title{font:700 30px Arial,sans-serif;fill:#10243a;text-anchor:middle}.sub{font:15px Arial,sans-serif;fill:#64748b;text-anchor:middle}</style></defs>
<rect class="bg" width="900" height="1120" rx="22"/>
<text class="title" x="450" y="48">Food Waste Monitoring System</text><text class="sub" x="450" y="74">Flowchart • beginner Python syllabus</text>
<rect class="terminal" x="350" y="95" width="200" height="52" rx="26"/><text class="white" x="450" y="128">START</text>
<path class="line" d="M450 147 V178"/><rect class="node" x="290" y="178" width="320" height="65" rx="10"/><text class="label" x="450" y="205">Set wastage limit to 10%</text><text class="small" x="450" y="227">Create empty lists for daily values</text>
<path class="line" d="M450 243 V275"/><path class="decision" d="M450 275 L590 323 L450 371 L310 323 Z"/><text class="label" x="450" y="319">All 7 days processed?</text><text class="small" x="450" y="340">loop condition</text>
<path class="line" d="M450 371 V402"/><rect class="node" x="300" y="402" width="300" height="62" rx="10"/><text class="label" x="450" y="428">Input meals prepared</text><text class="small" x="450" y="449">Must be greater than zero</text>
<path class="line" d="M450 464 V492"/><path class="decision" d="M450 492 L585 537 L450 582 L315 537 Z"/><text class="label" x="450" y="533">Prepared greater than 0?</text><text class="small" x="450" y="553">No: ask again</text>
<path class="line" d="M315 537 H190 V433 H300"/><text class="small" x="245" y="522">No</text><path class="line" d="M450 582 V610"/><rect class="node" x="300" y="610" width="300" height="62" rx="10"/><text class="label" x="450" y="636">Input meals served</text><text class="small" x="450" y="657">Must be between 0 and prepared</text>
<path class="line" d="M450 672 V700"/><path class="decision" d="M450 700 L590 747 L450 794 L310 747 Z"/><text class="label" x="450" y="743">Valid served count?</text><text class="small" x="450" y="764">0 ≤ served ≤ prepared</text>
<path class="line" d="M310 747 H190 V641 H300"/><text class="small" x="245" y="732">No</text>
<path class="line" d="M450 794 V820"/><rect class="node" x="270" y="820" width="360" height="70" rx="10"/><text class="label" x="450" y="847">Calculate and store values</text><text class="small" x="450" y="870">Leftovers = prepared − served; calculate %</text>
<path class="line" d="M630 855 H720 V323 H590"/><text class="small" x="744" y="582">Next day</text>
<path class="line" d="M450 323 H810 V930 H600"/><text class="small" x="705" y="309">Yes</text><rect class="node" x="260" y="930" width="340" height="64" rx="10"/><text class="label" x="430" y="956">Display weekly summary</text><text class="small" x="430" y="978">Totals and overall wastage percentage</text>
<path class="line" d="M430 994 V1020"/><rect class="terminal" x="350" y="1020" width="160" height="52" rx="26"/><text class="white" x="430" y="1053">STOP</text>
</svg>