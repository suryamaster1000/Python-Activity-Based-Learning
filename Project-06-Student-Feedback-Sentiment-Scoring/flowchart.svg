<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1000" viewBox="0 0 820 1000"><rect width="820" height="1000" rx="20" fill="#f5f7fb"/><g font-family="Arial" text-anchor="middle" fill="#1e293b"><text x="410" y="42" font-size="26" font-weight="bold">Student Feedback Sentiment Scoring</text><rect x="335" y="65" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="94" font-size="18" fill="white">START</text><path d="M410 110V140 M410 200V230 M410 300V330 M410 400V430 M410 500V530 M410 600V630 M410 720V750 M410 840V870" stroke="#64748b" stroke-width="2" fill="none"/><rect x="250" y="140" width="320" height="60" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="165" font-size="17">Input response count</text><text x="410" y="185" font-size="14">Must be at least one</text><rect x="230" y="230" width="360" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="257" font-size="17">Read one feedback comment</text><text x="410" y="280" font-size="14">Lowercase and replace punctuation</text><rect x="230" y="330" width="360" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="357" font-size="17">Split comment into words</text><text x="410" y="380" font-size="14">Count positive and negative keyword matches</text><rect x="230" y="430" width="360" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="457" font-size="17">Calculate sentiment score</text><text x="410" y="480" font-size="14">Positive matches − negative matches</text><path d="M410 530L545 565L410 600L275 565Z" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="410" y="570" font-size="16">Score compared with zero</text><path d="M275 565H100V645H200 M545 565H720V645H620 M410 600V645" stroke="#64748b" stroke-width="2" fill="none"/><text x="175" y="554" font-size="14">Below 0</text><text x="650" y="554" font-size="14">Above 0</text><text x="430" y="621" font-size="14">Equal 0</text><rect x="35" y="645" width="250" height="75" rx="10" fill="#fde7e7" stroke="#bb4949" stroke-width="2"/><text x="160" y="674" font-size="17">NEGATIVE</text><text x="160" y="697" font-size="14">Update negative count</text><rect x="295" y="645" width="230" height="75" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="2"/><text x="410" y="674" font-size="17">NEUTRAL</text><text x="410" y="697" font-size="14">Update neutral count</text><rect x="535" y="645" width="250" height="75" rx="10" fill="#e4f4ea" stroke="#39845a" stroke-width="2"/><text x="660" y="674" font-size="17">POSITIVE</text><text x="660" y="697" font-size="14">Update positive count</text><path d="M160 720V750H410 M410 720V750 M660 720V750H410" stroke="#64748b" stroke-width="2" fill="none"/><rect x="230" y="750" width="360" height="90" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="780" font-size="17">Store result and continue</text><text x="410" y="803" font-size="14">Repeat for every comment</text><text x="410" y="823" font-size="14">Then display detailed and overall results</text><rect x="335" y="870" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="899" font-size="18" fill="white">END</text><text x="410" y="956" font-size="14" fill="#64748b">Rule-based example; context and negation are not understood</text></g></svg>