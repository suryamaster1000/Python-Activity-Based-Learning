<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1760" viewBox="0 0 1000 1760" role="img" aria-labelledby="title desc">
<title id="title">String-Based Examination Answer Evaluation flowchart</title>
<desc id="desc">The program validates an answer key and student response strings, compares each response, calculates marks with negative marking, records the result, and prints a summary.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.bg{fill:#f4f7fb}.node{fill:#fff;stroke:#245780;stroke-width:2}.decision{fill:#fff4d6;stroke:#c58b1b;stroke-width:2}.terminal{fill:#10243a;stroke:#10243a;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.label{font:600 20px Arial,sans-serif;fill:#1e293b;text-anchor:middle}.small{font:16px Arial,sans-serif;fill:#475569;text-anchor:middle}.white{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle}.title{font:700 32px Arial,sans-serif;fill:#10243a;text-anchor:middle}.sub{font:16px Arial,sans-serif;fill:#64748b;text-anchor:middle}</style></defs>
<rect class="bg" width="1000" height="1760" rx="24"/>
<text class="title" x="500" y="52">String-Based Examination Answer Evaluation</text><text class="sub" x="500" y="82">Program flow • beginner Python syllabus</text>
<rect class="terminal" x="390" y="110" width="220" height="58" rx="29"/><text class="white" x="500" y="146">START</text>
<path class="line" d="M500 168 V200"/><rect class="node" x="280" y="200" width="440" height="70" rx="12"/><text class="label" x="500" y="230">Input and split answer key</text><text class="small" x="500" y="253">Convert options to uppercase</text>
<path class="line" d="M500 270 V305"/><path class="decision" d="M500 305 L650 355 L500 405 L350 355 Z"/><text class="label" x="500" y="351">Key valid?</text><text class="small" x="500" y="373">A, B, C, D only</text>
<path class="line" d="M350 355 H160 V435"/><text class="small" x="245" y="339">No</text><rect class="node" x="40" y="435" width="240" height="65" rx="10"/><text class="label" x="160" y="463">Ask for key again</text><text class="small" x="160" y="485">until valid</text><path class="line" d="M160 435 V355 H350"/>
<path class="line" d="M650 355 H820 V435"/><text class="small" x="735" y="339">Yes</text><rect class="node" x="680" y="435" width="285" height="70" rx="10"/><text class="label" x="822" y="465">Input student count</text><text class="small" x="822" y="488">must be positive</text>
<path class="line" d="M822 505 V545 H500 V575"/><path class="decision" d="M500 575 L650 625 L500 675 L350 625 Z"/><text class="label" x="500" y="621">Count greater</text><text class="small" x="500" y="643">than zero?</text>
<path class="line" d="M350 625 H160 V710"/><text class="small" x="245" y="609">No</text><rect class="node" x="40" y="710" width="240" height="65" rx="10"/><text class="label" x="160" y="738">Ask for count again</text><text class="small" x="160" y="760">until positive</text><path class="line" d="M160 710 V625 H350"/>
<path class="line" d="M650 625 H820 V710"/><text class="small" x="735" y="609">Yes</text><rect class="node" x="680" y="710" width="285" height="70" rx="10"/><text class="label" x="822" y="740">Input student name</text><text class="small" x="822" y="763">and answer string</text>
<path class="line" d="M822 780 V815 H500 V845"/><rect class="node" x="260" y="845" width="480" height="72" rx="12"/><text class="label" x="500" y="875">Validate response string</text><text class="small" x="500" y="899">Correct number of A/B/C/D/dash tokens</text>
<path class="line" d="M500 917 V950"/><path class="decision" d="M500 950 L650 1000 L500 1050 L350 1000 Z"/><text class="label" x="500" y="996">Response valid?</text><text class="small" x="500" y="1018">count and options</text>
<path class="line" d="M350 1000 H160 V1080"/><text class="small" x="245" y="984">No</text><rect class="node" x="40" y="1080" width="240" height="65" rx="10"/><text class="label" x="160" y="1108">Ask for answers</text><text class="small" x="160" y="1130">again</text><path class="line" d="M160 1080 V1000 H350"/>
<path class="line" d="M650 1000 H820 V1080"/><text class="small" x="735" y="984">Yes</text><rect class="node" x="680" y="1080" width="285" height="70" rx="10"/><text class="label" x="822" y="1110">Compare each answer</text><text class="small" x="822" y="1133">with the key at same position</text>
<path class="line" d="M822 1150 V1185 H500 V1215"/><rect class="node" x="260" y="1215" width="480" height="72" rx="12"/><text class="label" x="500" y="1245">Count correct / incorrect / blank</text><text class="small" x="500" y="1269">Use loop and conditions</text>
<path class="line" d="M500 1287 V1320"/><rect class="node" x="280" y="1320" width="440" height="72" rx="12"/><text class="label" x="500" y="1350">Calculate final marks</text><text class="small" x="500" y="1374">Correct × 4 − Incorrect × 1</text>
<path class="line" d="M500 1392 V1425"/><rect class="node" x="280" y="1425" width="440" height="72" rx="12"/><text class="label" x="500" y="1455">Store and display student result</text><text class="small" x="500" y="1479">Update class totals</text>
<path class="line" d="M500 1497 V1530"/><path class="decision" d="M500 1530 L650 1580 L500 1630 L350 1580 Z"/><text class="label" x="500" y="1576">More students?</text>
<path class="line" d="M350 1580 H70 V745 H680"/><text class="small" x="105" y="1564">Yes</text>
<path class="line" d="M650 1580 H820 V1645"/><text class="small" x="735" y="1564">No</text><rect class="node" x="680" y="1645" width="285" height="62" rx="10"/><text class="label" x="822" y="1672">Display class summary</text><text class="small" x="822" y="1694">and student-wise results</text>
<path class="line" d="M822 1707 V1720"/><rect class="terminal" x="730" y="1720" width="185" height="32" rx="16"/><text class="white" x="822" y="1742" style="font-size:16px">STOP</text>
</svg>