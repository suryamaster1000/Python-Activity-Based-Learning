<svg xmlns="http://www.w3.org/2000/svg" width="820" height="980" viewBox="0 0 820 980"><rect width="820" height="980" rx="20" fill="#f5f7fb"/><g font-family="Arial" text-anchor="middle" fill="#1e293b"><text x="410" y="42" font-size="26" font-weight="bold">Energy Conservation Before-and-After Analysis</text><rect x="335" y="65" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="94" font-size="18" fill="white">START</text><path d="M410 110V140 M410 210V240 M410 320V350 M410 430V460 M410 550V580 M410 670V700 M410 790V820" stroke="#64748b" stroke-width="2" fill="none"/><rect x="235" y="140" width="350" height="70" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="168" font-size="17">Input appliance count</text><text x="410" y="191" font-size="14">Must be at least one</text><rect x="220" y="240" width="380" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="270" font-size="17">Enter name and before/after readings</text><text x="410" y="294" font-size="14">Average daily use in kWh/day</text><text x="410" y="310" font-size="14">Reject blank names and negative values</text><rect x="220" y="350" width="380" height="80" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="380" font-size="17">Compare each appliance</text><text x="410" y="403" font-size="14">Before minus after consumption</text><path d="M410 460L545 505L410 550L275 505Z" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="410" y="510" font-size="16">Reduced, increased or unchanged?</text><rect x="35" y="580" width="240" height="90" rx="10" fill="#e4f4ea" stroke="#39845a" stroke-width="2"/><text x="155" y="610" font-size="16">Reduced</text><text x="155" y="635" font-size="14">Calculate reduction %</text><rect x="290" y="580" width="240" height="90" rx="10" fill="#fff4d6" stroke="#c58b1b" stroke-width="2"/><text x="410" y="610" font-size="16">Increased</text><text x="410" y="635" font-size="14">Calculate increase %</text><rect x="545" y="580" width="240" height="90" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="2"/><text x="665" y="610" font-size="16">Unchanged</text><text x="665" y="635" font-size="14">Record no change</text><path d="M275 505H155V580 M410 550V580 M545 505H665V580 M155 670V700H410 M410 670V700 M665 670V700H410" stroke="#64748b" stroke-width="2" fill="none"/><rect x="220" y="700" width="380" height="90" rx="10" fill="white" stroke="#245780" stroke-width="2"/><text x="410" y="732" font-size="17">Compare total before and after</text><text x="410" y="755" font-size="14">Avoid percentage when baseline total is zero</text><text x="410" y="775" font-size="14">Display overall change and category counts</text><rect x="335" y="820" width="150" height="45" rx="22" fill="#10243a"/><text x="410" y="849" font-size="18" fill="white">END</text><text x="410" y="925" font-size="14" fill="#64748b">Use comparable periods for a fair analysis</text></g></svg>