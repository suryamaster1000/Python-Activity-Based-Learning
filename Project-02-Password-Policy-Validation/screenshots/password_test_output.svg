<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc"><title id="title">Password policy test output summary</title><desc id="desc">Summary of ten passwords actually checked by running the project locally. Two accepted and eight rejected as expected.</desc><defs><style>.bg{fill:#0b1220}.panel{fill:#111c2e;stroke:#26374f;stroke-width:1}.head{font:700 29px Arial,sans-serif;fill:#f8fafc}.sub{font:15px Arial,sans-serif;fill:#a8b7cb}.th{font:700 14px Arial,sans-serif;fill:#9db1cb}.cell{font:16px Arial,sans-serif;fill:#e2e8f0}.ok{font:700 14px Arial,sans-serif;fill:#86efac}.bad{font:700 14px Arial,sans-serif;fill:#fca5a5}.foot{font:14px Arial,sans-serif;fill:#94a3b8}</style></defs><rect class="bg" width="1100" height="900" rx="18"/><text class="head" x="42" y="54">PASSWORD POLICY VALIDATION</text><text class="sub" x="42" y="82">Local execution test summary • Python 3 • Project 02</text><rect class="panel" x="40" y="112" width="1020" height="730" rx="12"/><text class="th" x="66" y="153">#</text><text class="th" x="120" y="153">SAMPLE INPUT</text><text class="th" x="410" y="153">ACTUAL RESULT</text><text class="th" x="590" y="153">CHECK / EXPECTED REASON</text><path d="M60 170 H1040" stroke="#334155"/><text class="cell" x="66" y="203">01</text><text class="cell" x="120" y="203">Strong#2026</text><text class="ok" x="410" y="203">ACCEPT</text><text class="cell" x="590" y="203">All rules pass</text><path d="M60 229 H1040" stroke="#26374f"/><text class="cell" x="66" y="256">02</text><text class="cell" x="120" y="256">Ab1!</text><text class="bad" x="410" y="256">REJECT</text><text class="cell" x="590" y="256">Minimum length</text><path d="M60 282 H1040" stroke="#26374f"/><text class="cell" x="66" y="309">03</text><text class="cell" x="120" y="309">lowercase1!</text><text class="bad" x="410" y="309">REJECT</text><text class="cell" x="590" y="309">Missing uppercase</text><path d="M60 335 H1040" stroke="#26374f"/><text class="cell" x="66" y="362">04</text><text class="cell" x="120" y="362">UPPERCASE1!</text><text class="bad" x="410" y="362">REJECT</text><text class="cell" x="590" y="362">Missing lowercase</text><path d="M60 388 H1040" stroke="#26374f"/><text class="cell" x="66" y="415">05</text><text class="cell" x="120" y="415">NoDigits!!</text><text class="bad" x="410" y="415">REJECT</text><text class="cell" x="590" y="415">Missing digit</text><path d="M60 441 H1040" stroke="#26374f"/><text class="cell" x="66" y="468">06</text><text class="cell" x="120" y="468">NoSpecial123</text><text class="bad" x="410" y="468">REJECT</text><text class="cell" x="590" y="468">Missing special character</text><path d="M60 494 H1040" stroke="#26374f"/><text class="cell" x="66" y="521">07</text><text class="cell" x="120" y="521">AAAabc1!</text><text class="bad" x="410" y="521">REJECT</text><text class="cell" x="590" y="521">3 repeated characters</text><path d="M60 547 H1040" stroke="#26374f"/><text class="cell" x="66" y="574">08</text><text class="cell" x="120" y="574">MyPassword12!</text><text class="bad" x="410" y="574">REJECT</text><text class="cell" x="590" y="574">Prohibited substring</text><path d="M60 600 H1040" stroke="#26374f"/><text class="cell" x="66" y="627">09</text><text class="cell" x="120" y="627">Space Pass1!</text><text class="bad" x="410" y="627">REJECT</text><text class="cell" x="590" y="627">Spaces are not allowed</text><path d="M60 653 H1040" stroke="#26374f"/><text class="cell" x="66" y="680">10</text><text class="cell" x="120" y="680">Aa1!bcde</text><text class="ok" x="410" y="680">ACCEPT</text><text class="cell" x="590" y="680">Exactly 8 characters; all rules pass</text><path d="M60 742 H1040" stroke="#334155"/><text class="ok" x="66" y="777">10 / 10 expected outcomes matched</text><text class="sub" x="66" y="805">2 accepted • 8 rejected • each rejection displayed a specific reason</text><text class="foot" x="42" y="872">Summary recreated from the captured program output; this is not a screenshot from an online service.</text></svg>